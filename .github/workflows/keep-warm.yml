# Render's free plan stops a service after 15 minutes without traffic and then
# takes about a minute to wake it. This ping keeps it warm so the phone never
# waits, and it also proves the service is up (it fails the run when it is not).
name: keep warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: |
          set -euo pipefail
          url="${BACKEND_URL%/}/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt got $code, retrying in 20s"
            sleep 20
          done
          echo "Backend is not healthy: last status $code"
          exit 1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
