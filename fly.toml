# VORTEX Anime streaming backend. A separate app from the music server.
# Create once:  fly apps create vortex-anime-api
#               fly secrets set API_TOKEN=<random token> --app vortex-anime-api
# Deploy:       npm run build && fly deploy --app vortex-anime-api --ha=false
app = "vortex-anime-api"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
